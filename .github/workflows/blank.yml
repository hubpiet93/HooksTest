name: Notify Outdated PRs

on:
  push:
    branches:
      - master

jobs:
  check-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Notify outdated PRs
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "master"
            });
            for (const pr of prs.data) {
              const compare = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: pr.head.sha,
                head: "master"
              });
              if (compare.data.status === "behind") {
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number
                });
                const alreadyCommented = comments.data.some(c =>
                  c.body.includes("❗️Ten PR wymaga synchronizacji z masterem")
                );
                if (!alreadyCommented) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: "❗️Ten PR wymaga synchronizacji z masterem. Proszę zmergować lub zrebase'ować aktualny master do tej gałęzi."
                  });
                }
              }
            }
