name: Notify Outdated PRs

on:
  push:
    branches:
      - '**'

permissions:
  issues: write
  pull-requests: write

jobs:
  check-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Notify outdated PRs
        uses: actions/github-script@v7
        with:
          script: |
            // Pobierz domyślną gałąź (main/master/inne)
            const repoInfo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const defaultBranch = repoInfo.data.default_branch;
            console.log(`Default branch: ${defaultBranch}`);

            // Sprawdź czy push był na domyślną gałąź
            if (context.ref !== `refs/heads/${defaultBranch}`) {
              console.log(`Push był na ${context.ref}, nie na domyślną gałąź (${defaultBranch}). Workflow kończy działanie.`);
              return;
            }

            // --- TYLKO JEŚLI PUSH BYŁ NA GAŁĄŹ GŁÓWNĄ, RESZTA LOGIKI ---
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: defaultBranch
            });
            console.log(`Znaleziono PR-ów: ${prs.data.length}`);
            for (const pr of prs.data) {
              console.log(`Sprawdzam PR #${pr.number} (${pr.title})`);
              const compare = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: pr.head.sha,
                head: defaultBranch
              });
              console.log(`PR #${pr.number}: status porównania względem ${defaultBranch}: ${compare.data.status}`);
              if (["behind", "diverged"].includes(compare.data.status)) {
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number
                });
                const alreadyCommented = comments.data.some(c =>
                  c.body.includes("❗️Ten branch wymaga aktualizacji względem gałęzi głównej")
                );
                console.log(`PR #${pr.number}: alreadyCommented = ${alreadyCommented}`);
                if (!alreadyCommented) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `❗️Ten branch wymaga aktualizacji względem gałęzi głównej (\`${defaultBranch}\`). Proszę zmergować lub zrebase'ować najnowszą wersję tej gałęzi do tej gałęzi PR.`
                  });
                  console.log(`Dodano komentarz do PR #${pr.number}`);
                } else {
                  console.log(`PR #${pr.number}: Komentarz już istnieje`);
                }
              } else {
                console.log(`PR #${pr.number}: Branch nie jest behind/diverged względem ${defaultBranch}`);
              }
            }
            console.log("Koniec skryptu");
