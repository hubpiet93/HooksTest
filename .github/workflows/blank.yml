name: Notify Outdated PRs

on:
  push:
    branches:
      - master

jobs:
  check-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check PRs and comment if out of date
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'EOF'
          const { Octokit } = require("@octokit/rest");
          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          (async () => {
            // Get all open PRs to master
            const { data: prs } = await octokit.pulls.list({
              owner,
              repo,
              state: "open",
              base: "master",
            });

            for (const pr of prs) {
              // Compare PR branch with master
              const compare = await octokit.repos.compareCommits({
                owner,
                repo,
                base: pr.head.sha,
                head: "master",
              });

              // If PR branch is behind master
              if (compare.data.status === "behind") {
                // Check if we've already commented
                const comments = await octokit.issues.listComments({
                  owner,
                  repo,
                  issue_number: pr.number,
                });
                const alreadyCommented = comments.data.some(c =>
                  c.body.includes("❗️Ten PR wymaga synchronizacji z masterem")
                );
                if (!alreadyCommented) {
                  await octokit.issues.createComment({
                    owner,
                    repo,
                    issue_number: pr.number,
                    body: "❗️Ten PR wymaga synchronizacji z masterem. Prosze zmergować lub zrebase'ować aktualny `master` do tej gałęzi.",
                  });
                  console.log(`Commented on PR #${pr.number}`);
                }
              }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
